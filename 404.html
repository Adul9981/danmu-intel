<!doctype html>
<html lang="zh-CN"><head>
<link rel="icon" type="image/svg+xml" href="favicon.svg"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 弹幕情报库</title><style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;--accent:#0071e3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 44px;text-align:center;max-width:420px}
.code{font-size:44px;font-weight:800;color:var(--accent);margin-bottom:6px}
h1{font-size:19px;font-weight:700;margin-bottom:8px}
p{color:var(--sub);font-size:13px;margin-bottom:22px}
a{display:inline-block;color:#fff;background:var(--accent);border-radius:12px;padding:10px 20px;text-decoration:none;font-size:14px;font-weight:600;margin:4px}
a.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
</style></head><body><div class="box">
<div class="code">404</div>
<h1>页面不存在或已移动</h1>
<p>链接可能已更新，回到主页或历史情报库看看。</p>
