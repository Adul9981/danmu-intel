<script>
const frame=document.getElementById('frame'),ttl=document.getElementById('ttl'),openLink=document.getElementById('open');
function show(btn){
  document.querySelectorAll('.navitem').forEach(x=>x.classList.toggle('on',x===btn));
  ttl.textContent=btn.querySelector('b').textContent;
  openLink.href=btn.dataset.src;
  const embed=btn.dataset.src+(btn.dataset.src.includes('?')?'&':'?')+'embed=1';
  if(frame.getAttribute('src')!==embed) frame.setAttribute('src',embed);
  history.replaceState(null,'','#'+btn.dataset.id);
}
document.querySelectorAll('.navitem').forEach(b=>b.addEventListener('click',()=>show(b)));
const start=document.querySelector('.navitem[data-id="'+(location.hash.slice(1)||'index')+'"]');
if(start) show(start);
</script>
