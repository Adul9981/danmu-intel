r:1px solid rgba(0,0,0,.055);color:#515154;font-weight:500;font-size:13px;text-decoration:none;white-space:nowrap">赛前情报</a><a href="intel_help.html" style="display:inline-flex;align-items:center;height:32px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.055);color:#515154;font-weight:500;font-size:13px;text-decoration:none;white-space:nowrap">FAQ</a><span aria-hidden="true" style="width:1px;height:16px;background:#d8d8dd;margin:0 3px;flex:none"></span><a href="pattern_decision_workspace.html" style="display:inline-flex;align-items:center;height:32px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.055);color:#515154;font-weight:500;font-size:13px;text-decoration:none;white-space:nowrap">形态决策台</a><a href="pattern_atlas.html" style="display:inline-flex;align-items:center;height:32px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.055);color:#515154;font-weight:500;font-size:13px;text-decoration:none;white-space:nowrap">形态图谱</a><span aria-hidden="true" style="width:1px;height:16px;background:#d8d8dd;margin:0 3px;flex:none"></span><a href="analytics.html" style="display:inline-flex;align-items:center;height:32px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.055);color:#515154;font-weight:500;font-size:13px;text-decoration:none;white-space:nowrap">访问统计</a><a href="search.html" style="display:inline-flex;align-items:center;height:32px;padding:0 11px;border-radius:999px;background:#1d1d1f;color:#fff;font-weight:650;font-size:13px;text-decoration:none;white-space:nowrap" aria-current="page">搜索</a></div></nav><div style="max-width:1280px;margin:4px auto 14px;padding:0 16px;font-size:12px;color:#6e6e73;font-family:-apple-system,'PingFang SC',sans-serif"><a href="../index.html" style="color:#6e6e73;text-decoration:none">首页</a> › <b style="color:#1d1d1f">搜索</b></div><main class="wrap"><header><div class="eyebrow">GLOBAL SEARCH</div><h1>搜索情报库</h1>
<p>按比赛、队伍、选手、联赛、日期或报告节点搜索。输入中文、英文缩写均可。</p></header>
<div class="searchbox"><input id="q" type="search" autocomplete="off" autofocus placeholder="例如：T1、LCK、2026-11-27、BP、Faker"></div>
<div class="chips" id="chips"><button class="chip on" data-type="">全部</button><button class="chip" data-type="比赛">比赛</button><button class="chip" data-type="节点">节点</button><button class="chip" data-type="画像">画像</button><button class="chip" data-type="页面">页面</button></div>
<div class="result-head"><span id="count">正在载入索引…</span><span id="updated"></span></div>
<div class="results" id="results"></div></main>
<script>
(function(){
  const $=id=>document.getElementById(id);
  let entries=[],type='';
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const norm=s=>String(s||'').toLocaleLowerCase('zh-CN').replace(/\s+/g,' ').trim();
  function render(){
    const q=norm($('q').value);
    let rows=entries.filter(x=>!type||x.type===type);
    if(q){const terms=q.split(' ').filter(Boolean);rows=rows.filter(x=>{const hay=norm([x.title,x.subtitle,...(x.keywords||[])].join(' '));return terms.every(t=>hay.includes(t))});}
    const total=rows.length;rows=rows.slice(0,80);
    $('count').textContent=(q?'搜索结果 ':'浏览结果 ')+total+' 条'+(total>rows.length?' · 当前显示 '+rows.length+' 条':'');
    $('results').innerHTML=rows.length?rows.map(x=>'<a class="result" href="'+esc(x.url)+'"><span class="type">'+esc(x.type)+'</span><span><b>'+esc(x.title)+'</b><small>'+esc(x.subtitle)+'</small></span><span class="arrow">→</span></a>').join(''):'<div class="empty">没有找到匹配结果，请尝试队伍缩写、联赛或日期。</div>';
  }
  $('q').addEventListener('input',render);
  document.querySelectorAll('[data-type]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('on'));btn.classList.add('on');type=btn.dataset.type;render();});
  fetch('search_index.json?v='+Date.now(),{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(data=>{entries=data.entries||[];$('updated').textContent='索引更新 '+String(data.generated_at||'').replace('T',' ').slice(0,16);render();}).catch(err=>{$('count').textContent='搜索索引加载失败';$('results').innerHTML='<div class="empty">'+esc(err.message||err)+'</div>';});
})();
</script><script>if(location.search.indexOf("embed=1")>-1){document.querySelectorAll("nav").forEach(function(n){n.style.display="none"});document.querySelectorAll("div[style*='max-width:1020px']").forEach(function(n){n.style.display="none"});}</script><script src="analytics-config.js?v=20261109c" defer></script><script src="analytics.js?v=20261109c" defer></script><link rel="stylesheet" href="assistant.css?v=20261124a"><script src="assistant.js?v=20261124a" defer></script></body></html>
