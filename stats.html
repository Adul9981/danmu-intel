<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据统计 · Danmu Intel</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;--accent:#0071e3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;padding:28px 16px 60px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:24px;font-weight:800;margin-bottom:4px}
.sub{color:var(--sub);font-size:13px;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat .num{font-size:26px;font-weight:800;color:var(--accent)}
.stat .lbl{font-size:12px;color:var(--sub);margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h2{font-size:15px;font-weight:800;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:0}
.row .p{color:var(--ink);font-weight:600}
.row .n{color:var(--sub)}
footer{margin-top:20px;font-size:11.5px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body style="padding-top:0;font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Text&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;line-height:1.6;color:#1d1d1f">
<nav style="position:sticky;top:0;z-index:20;background:rgba(245,245,247,.92);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid #e5e5ea;padding:10px 16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;max-width:1020px;margin:0 auto 18px;box-sizing:border-box"><a href="index.html" style="color:#1d1d1f;text-decoration:none;font-weight:800;font-size:14px;margin-right:auto"><span style="display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#0071e3,#5ac8fa);color:#fff;font-size:11px;font-weight:800;margin-right:7px">DI</span>弹幕情报库</a><a href="index.html" style="color:#0071e3;font-weight:700;font-size:13px;text-decoration:none">首页</a><a href="intel/today.html" style="color:#6e6e73;font-weight:500;font-size:13px;text-decoration:none">今日比赛</a><a href="intel/history.html" style="color:#6e6e73;font-weight:500;font-size:13px;text-decoration:none">历史情报库</a><a href="intel/market_links.html" style="color:#6e6e73;font-weight:500;font-size:13px;text-decoration:none">市场链接</a><a href="subscribe.html" style="color:#6e6e73;font-weight:500;font-size:13px;text-decoration:none">订阅</a></nav><div style="max-width:1020px;margin:-10px auto 14px;padding:0 16px;font-size:12px;color:#6e6e73;font-family:-apple-system,'PingFang SC',sans-serif"><a href="index.html" style="color:#6e6e73;text-decoration:none">首页</a> › <b style="color:#1d1d1f">数据统计</b></div><div class="wrap">
<h1>网站数据统计</h1>
<p class="sub">访问量 · 每日更新 · 数据经 Vercel 中转记录到云服务器</p>
<div class="stats">
  <div class="stat"><div class="num" id="total">-</div><div class="lbl">累计访问（PV）</div></div>
  <div class="stat"><div class="num" id="today">-</div><div class="lbl">今日访问（PV）</div></div>
  <div class="stat"><div class="num" id="pages">-</div><div class="lbl">浏览量最大页面</div></div>
</div>
<div class="card">
  <h2>页面浏览排行</h2>
  <div id="list"><div class="row"><span class="p">加载中…</span></div></div>
</div>
<footer>弹幕情报库 · Danmu Intel · 数据统计</footer>
</div>
<script>
fetch("https://danmu-intel-api.vercel.app/api/stats")
  .then(function (r) { return r.json(); })
  .then(function (d) {
    document.getElementById("total").textContent = d.total_views || 0;
    document.getElementById("today").textContent = d.today_views || 0;
    var top = (d.top_pages || [])[0];
    document.getElementById("pages").textContent = top ? top[0] : "-";
    var html = "";
    (d.top_pages || []).forEach(function (p) {
      html += '<div class="row"><span class="p">' + p[0] + '</span><span class="n">' + p[1] + ' 次</span></div>';
    });
    document.getElementById("list").innerHTML = html || '<div class="row"><span class="p">暂无数据</span></div>';
  })
  .catch(function () {
    document.getElementById("list").innerHTML = '<div class="row"><span class="p">统计服务暂不可用</span></div>';
  });
</script>
<script>fetch("https://danmu-intel-api.vercel.app/api/track",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({page:location.pathname})}).catch(function(){})</script><script>if(location.search.indexOf("embed=1")>-1){document.querySelectorAll("nav").forEach(function(n){n.style.display="none"});document.querySelectorAll("div[style*='max-width:1020px']").forEach(function(n){n.style.display="none"});}</script><script>if(location.search.indexOf("embed=1")>-1){document.querySelectorAll("nav").forEach(function(n){n.style.display="none"});document.querySelectorAll("div[style*='max-width:1020px']").forEach(function(n){n.style.display="none"});}</script><script>if(location.search.indexOf("embed=1")>-1){document.querySelectorAll("nav").forEach(function(n){n.style.display="none"});document.querySelectorAll("div[style*='max-width:1020px']").forEach(function(n){n.style.display="none"});}</script></body>
</html>
